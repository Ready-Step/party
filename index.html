<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2026 학예회 순서 · 1학년 2반 꿈 키움 재능마당</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --line:#444; --yellow:#ffd966; --orange:#f6b48a; --peach:#f7cbae;
  --font:'Jua','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0e0e10;overflow:hidden;font-family:var(--font);-webkit-user-select:none;user-select:none}
body.idle{cursor:none}

/* ===== 무대: 1920x1080 고정 크기를 화면에 맞춰 축소/확대 ===== */
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;margin:-540px 0 0 -960px;transform-origin:50% 50%;overflow:hidden;background:#000}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s;overflow:hidden}
.slide.on{opacity:1;visibility:visible}

/* ===== 배경 ===== */
.bg-sky{background:linear-gradient(#b9e4fb,#d9f1fd)}
.bg-blue,.bg-peach{background-size:48px 48px;background-image:
  linear-gradient(rgba(255,255,255,.7) 2px,transparent 2px),
  linear-gradient(90deg,rgba(255,255,255,.7) 2px,transparent 2px)}
.bg-blue{background-color:#dbe8f6}
.bg-peach{background-color:#fbe4d4}
.bg-blobs{background:#fddcc4;isolation:isolate}
/* 격자는 z-index:-1 → 배경색 바로 위, 색 원(blob)·글상자·캐릭터보다 항상 뒤 */
.bg-blobs::before{content:'';position:absolute;inset:0;z-index:-1;background-size:210px 210px;background-image:
  linear-gradient(rgba(255,255,255,.55) 4px,transparent 4px),
  linear-gradient(90deg,rgba(255,255,255,.55) 4px,transparent 4px)}
.blob{position:absolute;border-radius:50%}
.bg-black{background:#000}

/* 구름 */
.cl{position:absolute;width:var(--w);height:calc(var(--w)*.46);background:#fff;border-radius:999px}
.cl::before,.cl::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cl::before{left:16%;top:-42%;width:42%;height:95%}
.cl::after{left:46%;top:-58%;width:50%;height:115%}
.cb{position:absolute;background:#fff;border-radius:50%}

/* 장식 */
.spark{position:absolute;width:var(--s,60px);height:var(--s,60px);animation:twinkle 2.4s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
@keyframes twinkle{from{transform:scale(.7) rotate(0);opacity:.6}to{transform:scale(1.1) rotate(15deg);opacity:1}}
.conf{position:absolute;opacity:.9}

/* ===== 박스 (캔바의 둥근 테두리 박스) ===== */
.box{position:absolute;left:0;right:0;margin:0 auto;display:flex;align-items:center;justify-content:center;
  border:7px solid var(--line);border-radius:40px;padding:0 50px;color:#2b2b2b;text-align:center;white-space:nowrap}
.box>span{display:block;flex:none;line-height:1.3}
.w{background:#fff}.y{background:var(--yellow)}.o{background:var(--orange)}.p{background:var(--peach)}

/* 푸들 */
.puppy{position:absolute;left:0;right:0;margin:0 auto;width:520px;bottom:-30px}
.puppy svg{display:block;width:100%;height:auto;animation:bob 2.2s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-14px)}}
.warn{position:absolute;width:150px;height:150px;border-radius:50%;background:#fff;border:7px solid var(--line);display:grid;place-items:center}

/* 함께 나눠요 카드 */
.card{position:absolute;top:396px;width:415px;height:620px;border:6px solid var(--line);border-radius:34px;
  display:flex;flex-direction:column;align-items:center;padding-top:50px;font-size:62px;line-height:1.3;text-align:center;color:#2b2b2b}
.card svg{width:230px;height:230px;margin-bottom:34px}

/* 등장 애니메이션 (슬라이드가 켜질 때마다) */
.slide.on .pop{animation:pop .6s var(--d,0s) both cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{opacity:0;transform:scale(.86) translateY(34px)}to{opacity:1;transform:none}}

/* 기다렸죠? */
.wait{position:absolute;inset:0;display:grid;place-items:center}
.wait span{font-size:210px;letter-spacing:.28em;padding-left:.28em;
  background:linear-gradient(#fff,#a9d6ff 55%,#4b90ff);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(70,150,255,.85));animation:glow 2.4s ease-in-out infinite alternate}
.slide.on .wait span{animation:fadein 1s both, glow 2.4s 1s ease-in-out infinite alternate}
@keyframes fadein{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes glow{from{filter:drop-shadow(0 0 14px rgba(70,150,255,.6))}to{filter:drop-shadow(0 0 40px rgba(90,170,255,1))}}

/* ===== 영상 슬라이드 (4번 오프닝) ===== */
.vid{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;opacity:0;transition:opacity .4s;z-index:2;cursor:pointer}
.slide.vp-started .vid{opacity:1}
.slide .wait{transition:opacity .4s}
.slide.vp-started .wait{opacity:0}
.vplay{position:absolute;left:0;right:0;margin:0 auto;bottom:100px;width:140px;height:140px;border-radius:50%;background:rgba(255,217,102,.96);
  border:7px solid var(--line);display:grid;place-items:center;font-size:58px;color:#333;padding-left:8px;cursor:pointer;z-index:3;
  box-shadow:0 8px 0 rgba(0,0,0,.25);transition:transform .15s}
.vplay:hover{transform:scale(1.08)}
.slide.vp-playing .vplay,.slide.vp-ended .vplay{display:none}
.vmsg{display:none;position:absolute;left:0;right:0;bottom:290px;margin:0 auto;width:1100px;padding:18px 28px;z-index:4;text-align:center;
  font-family:'Noto Sans KR',sans-serif;font-size:36px;line-height:1.45;color:#b3261e;background:#fff3f1;border:6px solid var(--line);border-radius:24px}
.slide.vp-err .vmsg{display:block}

/* ===== 음악 버튼 (해당 슬라이드에서만 표시) ===== */
#music{position:absolute;left:0;right:0;bottom:28px;z-index:20;display:none;justify-content:center;pointer-events:none}
#music.show{display:flex}
.m-list{display:flex;gap:46px;justify-content:center}
.m-btn{all:unset;position:relative;box-sizing:border-box;width:118px;height:118px;border-radius:50%;background:rgba(255,217,102,.97);
  border:7px solid var(--line);display:grid;place-items:center;font-family:var(--font);font-size:48px;color:#333;cursor:pointer;
  pointer-events:auto;box-shadow:0 8px 0 rgba(0,0,0,.2);transition:transform .15s,background .2s}
.m-btn:hover,.m-btn:focus-visible{transform:scale(1.08)}
.m-btn.playing{background:var(--orange)}
.m-ico{padding-left:7px}
.m-btn.playing .m-ico{padding-left:0}
/* 마우스를 올리면 음원 제목이 위로 팝업 */
.m-tip{position:absolute;bottom:calc(100% + 16px);left:50%;transform:translate(-50%,6px);background:#fff;border:5px solid var(--line);border-radius:20px;
  padding:8px 24px;font-size:38px;line-height:1.3;white-space:nowrap;color:#2b2b2b;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
.m-btn:hover .m-tip,.m-btn:focus-visible .m-tip{opacity:1;transform:translate(-50%,0)}
.m-msg{display:none;position:absolute;left:0;right:0;bottom:175px;margin:0 auto;width:1100px;padding:18px 28px;text-align:center;pointer-events:none;
  font-family:'Noto Sans KR',sans-serif;font-size:34px;line-height:1.45;color:#b3261e;background:#fff3f1;border:6px solid var(--line);border-radius:24px}
#music.err .m-msg{display:block}
#ytbox{position:absolute;left:-9999px;top:0;width:320px;height:180px}

/* ===== 조작 바 / 목차 (화면 비율과 무관하게 항상 같은 크기) ===== */
#ui{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:6px;
  background:rgba(20,20,22,.78);backdrop-filter:blur(6px);border-radius:999px;padding:6px 10px;opacity:0;transition:opacity .25s;font-family:'Noto Sans KR',sans-serif}
body.active #ui{opacity:1}
#ui button{all:unset;cursor:pointer;color:#fff;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;font-size:18px}
#ui button:hover,#ui button:focus-visible{background:rgba(255,255,255,.2)}
#pg{color:#fff;font-size:15px;min-width:74px;text-align:center}
#overview{position:fixed;inset:0;z-index:60;background:rgba(14,14,16,.94);overflow:auto;padding:28px;font-family:'Noto Sans KR',sans-serif}
#overview[hidden]{display:none}
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.ov-grid button{all:unset;cursor:pointer;background:#25252a;color:#eee;border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.4;box-sizing:border-box}
.ov-grid button:hover,.ov-grid button:focus-visible{background:#3a3a42}
.ov-grid button.cur{outline:3px solid var(--yellow)}
.ov-grid em{display:block;font-style:normal;font-size:13px;color:#ffd966;margin-bottom:2px}

@media (prefers-reduced-motion:reduce){
  .slide,.slide.on .pop,.puppy svg,.spark,.wait span{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<div id="stage">

</div>

<div id="ui">

const FUR='#cf8a37', INK='#4b3a2f';

function puppy(mood){            // mood: happy | clap | stern
  const c=[[300,270,172]];
  for(let a=0;a<360;a+=30){const r=a*Math.PI/180;c.push([300+168*Math.cos(r),270+168*Math.sin(r),62]);}
  c.push([105,330,66],[495,330,66],[300,95,56],[245,105,50],[355,105,50]);
  const mk=(extra)=>c.map(([x,y,r])=>`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${FUR}" ${extra}/>`).join('');
  const head=`<g transform="translate(0,250) scale(1,.74) translate(0,-270)">${mk(`stroke="${INK}" stroke-width="9" vector-effect="non-scaling-stroke"`)}${mk('')}</g>`;
  const eye=(x)=>`<ellipse cx="${x}" cy="252" rx="${mood==='stern'?15:17}" ry="${mood==='stern'?17:22}" fill="#2a2018"/><circle cx="${x-5}" cy="244" r="6" fill="#fff"/>`;

  for(let i=0;i<n;i++){
    const a=rnd()*Math.PI*2, d=40+rnd()*300, sz=7+rnd()*11;

/* ===== 음악: 유튜브 구간 재생 + 음원 파일 재생 =====
   한 슬라이드에 음원이 여러 개면 버튼이 여러 개 생기고, 한 번에 하나만 재생됩니다.
   같은 버튼을 다시 누르면 일시정지 / 이어서 재생. end 가 지정된 음원은 마지막 2초 동안 서서히 작아집니다. */
const music=(function(){
  const el=document.getElementById('music'), list=document.getElementById('mList'), msg=document.getElementById('mMsg');
  const FADE=2;
  let tracks=[], btns=[], act=-1, state='idle';      // act: 지금 선택된 음원 번호, state: idle | playing | paused
  let yt=null, ytReady=false, ytCreating=false, waiters=[], timer=null, audio=null, pre=[];

  const sec=v=>{ if(v===undefined||v===null||v==='') return 0; if(typeof v==='number') return v;
    const p=String(v).trim().split(':').map(Number); return p.length===3?p[0]*3600+p[1]*60+p[2]:p.length===2?p[0]*60+p[1]:p[0]; };
  const norm=c=>(Array.isArray(c)?c:[c]).map(t=>({title:t.title||'음악',yt:t.yt||t.id,src:t.src,
    _s:sec(t.start),_e:(t.end===undefined||t.end==='')?null:sec(t.end)}));
  const setMsg=t=>{ msg.textContent=t||''; el.classList.toggle('err',!!t); };
  const paint=(i,st)=>{ const b=btns[i]; if(!b) return; b.classList.toggle('playing',st==='playing');
    b.querySelector('.m-ico').textContent=st==='playing'?'❚❚':'▶'; };

  /* ── 유튜브 ── */
  function loadAPI(){
    return new Promise((res,rej)=>{
      if(window.YT&&YT.Player) return res();
      const prevCb=window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady=()=>{ prevCb&&prevCb(); res(); };
      if(!document.getElementById('yt-api')){
        const s=document.createElement('script'); s.id='yt-api'; s.src='https://www.youtube.com/iframe_api';
        s.onerror=()=>rej(new Error('api')); document.head.appendChild(s);
      }
    });
  }
  function ensureYT(videoId){
    return loadAPI().then(()=>new Promise(res=>{
      if(ytReady) return res();
      waiters.push(res);
      if(ytCreating) return;
      ytCreating=true;
      const vars={playsinline:1,controls:0,rel:0,disablekb:1,modestbranding:1,iv_load_policy:3,fs:0};
      if(/^https?:$/.test(location.protocol)) vars.origin=location.origin;
      yt=new YT.Player('ytplayer',{width:'320',height:'180',videoId:videoId,playerVars:vars,events:{
        onReady:()=>{ ytReady=true; waiters.splice(0).forEach(f=>f()); },
        onStateChange:e=>{ if(e.data===0&&act>=0&&tracks[act]&&tracks[act].yt) finish(); },   // 0 = 끝남
        onError:e=>{
          const m={2:'영상 주소(ID)가 올바르지 않아요.',5:'이 영상은 재생할 수 없어요.',100:'영상이 삭제되었거나 비공개예요.',
            101:'영상 주인이 외부 재생을 막아 두었어요. 다른 영상을 써 주세요.',150:'영상 주인이 외부 재생을 막아 두었어요. 다른 영상을 써 주세요.',
            153:'이 파일을 그냥 열면 유튜브가 재생을 막을 수 있어요. 웹 주소(https)로 올려서 열어 보세요.'};
          fail('재생 오류('+e.data+'): '+(m[e.data]||'영상을 불러오지 못했어요.'));
        }}});
    }));
  }

  /* ── 음원 파일 ── */
  function getAudio(){
    if(audio) return audio;
    audio=new Audio(); audio.preload='auto';
    audio.addEventListener('ended',()=>{ if(act>=0&&tracks[act]&&tracks[act].src) finish(); });
    audio.addEventListener('error',()=>{ if(act>=0&&tracks[act]&&tracks[act].src)
      fail('음원 파일('+tracks[act].src+')을 불러오지 못했어요. index.html과 같은 폴더에 올렸는지, 파일 이름이 같은지 확인해 주세요.'); });
    return audio;
  }

  /* ── 공통 동작 ── */
  const setVol=(t,v)=>{ try{ if(t.src){ if(audio) audio.volume=v; } else if(ytReady){ yt.setVolume(Math.round(v*100)); } }catch(_){} };
  function pauseCur(){ const t=tracks[act]; if(!t) return; try{ if(t.src){ audio&&audio.pause(); } else if(ytReady){ yt.pauseVideo(); } }catch(_){} }
  function resumeCur(){ const t=tracks[act]; if(!t) return;
    try{ if(t.src){ const p=audio.play(); p&&p.catch&&p.catch(()=>{}); } else if(ytReady){ yt.playVideo(); } }catch(_){} }
  const stopTimer=()=>{ clearInterval(timer); timer=null; };
  const startTimer=()=>{ stopTimer(); timer=setInterval(tick,200); };
  function finish(){ stopTimer(); if(act>=0) paint(act,'idle'); act=-1; state='idle'; }
  function fail(text){ setMsg(text); pauseCur(); finish(); }
  function stopCurrent(){ stopTimer(); if(act>=0){ pauseCur(); paint(act,'idle'); } act=-1; state='idle'; }

  function tick(){                                    // 끝 시간 감시 + 마지막 2초 페이드아웃
    if(act<0) return;
    const t=tracks[act]; if(t._e===null) return;
    let cur;
    if(t.src){ if(!audio) return; cur=audio.currentTime; }
    else{ if(!ytReady||yt.getPlayerState()!==1) return; cur=yt.getCurrentTime(); }
    const left=t._e-cur;
    if(left<=FADE) setVol(t,Math.max(0,left/FADE));
    if(left<=0.15){ pauseCur(); finish(); }
  }

  function start(i){
    const t=tracks[i]; setMsg('');
    stopCurrent();
    act=i; state='playing'; paint(i,'playing');
    if(t.src){
      const a=getAudio(); a.src=t.src; a.volume=1;
      if(t._s>0) a.addEventListener('loadedmetadata',()=>{ if(act===i) try{ a.currentTime=t._s; }catch(_){} },{once:true});
      const p=a.play(); if(p&&p.catch) p.catch(e=>{ if(e&&e.name==='AbortError') return;
        fail('음원 파일('+t.src+')을 재생하지 못했어요. 파일 이름과 위치를 확인해 주세요.'); });
    }else{
      const go=()=>{ if(act!==i) return; const o={videoId:t.yt,startSeconds:t._s}; if(t._e!==null) o.endSeconds=t._e;
        try{ yt.setVolume(100); yt.loadVideoById(o); }catch(_){ fail('유튜브 플레이어를 시작하지 못했어요.'); } };
      if(ytReady) go(); else ensureYT(t.yt).then(go).catch(()=>fail('유튜브에 연결할 수 없어요. 인터넷 연결을 확인해 주세요.'));
    }
    startTimer();
  }

  function onBtn(i){
    if(act===i){                                      // 같은 버튼: 일시정지 ↔ 이어서 재생
      if(state==='playing'){ pauseCur(); state='paused'; paint(i,'paused'); stopTimer(); }
      else if(state==='paused'){ resumeCur(); state='playing'; paint(i,'playing'); startTimer(); }
      return;
    }
    start(i);
  }

  function enter(c){
    leave();
    tracks=c?norm(c):[]; btns=[]; list.innerHTML=''; setMsg('');
    if(!tracks.length){ el.classList.remove('show'); return; }
    tracks.forEach((t,i)=>{
      const b=document.createElement('button'); b.type='button'; b.className='m-btn';
      b.setAttribute('aria-label',t.title+' 재생');
      b.innerHTML='<span class="m-ico">▶</span><span class="m-tip"></span>';
      b.querySelector('.m-tip').textContent=t.title;
      b.addEventListener('mousedown',e=>e.preventDefault());        // 클릭 후 포커스가 남아 키보드 이동을 방해하지 않도록
      b.addEventListener('click',e=>{ e.stopPropagation(); onBtn(i); });
      list.appendChild(b); btns.push(b);
    });
    el.classList.add('show');
    pre=tracks.filter(t=>t.src).map(t=>{ const a=new Audio(); a.preload='auto'; a.src=t.src; return a; });   // 미리 받아 두기
    const first=tracks.find(t=>t.yt);
    if(first) ensureYT(first.yt).catch(()=>{});                                                              // 유튜브 플레이어 미리 준비
  }
  function leave(){ stopCurrent(); }
  function toggle(){ if(act>=0) onBtn(act); else if(tracks.length) onBtn(0); }
  return {enter,toggle};
})();

/* ===== 영상 슬라이드: 4번 오프닝 =====
   ▶ 버튼을 눌러야 재생됩니다.  재생 중 영상을 클릭하면 일시정지 / 다시 클릭하면 이어서 재생.
   키보드(→, 스페이스, 리모컨 등)는 항상 '다음 슬라이드'로 넘어갑니다. */
function playVideo(v){
  const pr=v.play();
  if(pr&&pr.catch) pr.catch(()=>{ v.closest('.slide').classList.add('vp-ended','vp-err'); });
}
slides.forEach(sl=>{
  const v=sl.querySelector('video'); if(!v) return;
  v.addEventListener('play',()=>{ sl.classList.remove('vp-ended'); sl.classList.add('vp-started','vp-playing'); });
  v.addEventListener('pause',()=>{ if(!v.ended) sl.classList.remove('vp-playing'); });
  v.addEventListener('ended',()=>{ sl.classList.remove('vp-playing'); sl.classList.add('vp-ended'); });
  v.addEventListener('error',()=>{ sl.classList.add('vp-ended','vp-err'); });
  v.addEventListener('click',e=>{ e.stopPropagation(); v.paused?playVideo(v):v.pause(); });
  const b=sl.querySelector('.vplay');
  b.addEventListener('click',e=>{ e.stopPropagation(); playVideo(v); });
  b.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); e.stopPropagation(); playVideo(v); } });
});
function resetVideos(keep){      // 다른 슬라이드로 가면 멈추고 처음으로 되돌림 (다시 오면 처음부터)
  slides.forEach(sl=>{
    const v=sl.querySelector('video'); if(!v||sl===keep) return;
    v.pause(); try{ v.currentTime=0; }catch(_){}
    sl.classList.remove('vp-started','vp-playing','vp-ended','vp-err');
  });
}

/* ===== 목차 ===== */
const ov=document.getElementById('overview'), ovGrid=document.getElementById('ovGrid');
S.forEach((s,i)=>{
  const b=document.createElement('button'); b.innerHTML=`<em>${i+1}${MUSIC[i+1]?' ♪':''}</em>${s.label}`;
  b.onclick=()=>{ ov.hidden=true; go(i+1); }; ovGrid.appendChild(b);
});
const toggleOv=()=>{ ov.hidden=!ov.hidden; if(!ov.hidden){ const c=ovGrid.children[cur-1]; c&&c.focus(); } };
const toggleFs=()=>{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); };

/* ===== 입력: 키보드 / 클릭 / 터치 / 클리커 ===== */
addEventListener('keydown',e=>{
  if(!ov.hidden){ if(e.key==='Escape'||e.key==='o'||e.key==='O'){ ov.hidden=true; } return; }
  if(e.target.closest&&e.target.closest('.m-btn,.vplay')) return;   // 버튼에 포커스가 있을 땐 버튼 동작 우선
  switch(e.key){
    case 'ArrowRight':case 'ArrowDown':case 'PageDown':case ' ':case 'Enter': e.preventDefault(); next(); break;
    case 'ArrowLeft':case 'ArrowUp':case 'PageUp':case 'Backspace': e.preventDefault(); prev(); break;
    case 'Home': go(1); break;
    case 'End': go(TOTAL); break;
    case 'f':case 'F': toggleFs(); break;
    case 'o':case 'O': toggleOv(); break;
    case 'm':case 'M': music.toggle(); break;
  }
});
stage.addEventListener('click',e=>{ if(e.target.closest('#music,.vplay,.vid')) return; next(); });
document.getElementById('bPrev').onclick=prev;
document.getElementById('bNext').onclick=next;
document.getElementById('bOv').onclick=toggleOv;
document.getElementById('bFs').onclick=toggleFs;
let sx=null;
addEventListener('touchstart',e=>{ sx=e.touches[0].clientX; },{passive:true});
addEventListener('touchend',e=>{ if(sx===null) return; const dx=e.changedTouches[0].clientX-sx; sx=null;
  if(Math.abs(dx)>60){ dx<0?next():prev(); } },{passive:true});

/* 마우스를 움직이면 조작 바 표시, 가만히 있으면 숨김 */
let idleT; const wake=()=>{ document.body.classList.add('active'); document.body.classList.remove('idle'); clearTimeout(idleT);
  idleT=setTimeout(()=>{ document.body.classList.remove('active'); document.body.classList.add('idle'); },2500); };
addEventListener('mousemove',wake); wake();

addEventListener('hashchange',()=>{ const n=parseInt(location.hash.slice(1)); if(n&&n!==cur) go(n,true); });
go(parseInt(location.hash.slice(1))||1,true);
</script>
